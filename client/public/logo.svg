<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="MediCare">
  <title>MediCare</title>
  <!-- Horizontal lockup for docs/READMEs. The mark half mirrors
       logo-mark.svg; keep the two files in sync. -->
  <defs>
    <linearGradient id="mc-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A78E7" />
      <stop offset="0.55" stop-color="#3365E2" />
      <stop offset="1" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="mc-sheen" x1="0" y1="0" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <mask id="mc-cut">
      <rect width="64" height="64" fill="#fff" />
      <g stroke="#000" stroke-width="6.4" stroke-linecap="round">
        <line x1="32" y1="28.85" x2="32" y2="41.65" />
        <line x1="25.6" y1="35.25" x2="38.4" y2="35.25" />
      </g>
    </mask>
  </defs>

  <rect width="64" height="64" rx="15.5" fill="url(#mc-tile)" />
  <rect width="64" height="64" rx="15.5" fill="url(#mc-sheen)" />

  <g mask="url(#mc-cut)">
    <rect x="21.2" y="12" width="4.8" height="12" rx="2.4" fill="#fff" />
    <rect x="38" y="12" width="4.8" height="12" rx="2.4" fill="#fff" />
    <rect x="13.5" y="20" width="37" height="30.5" rx="7.5" fill="#fff" />
  </g>

  <text
    x="82"
    y="42.5"
    font-family="'DM Sans', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-0.6"
  >
    <tspan fill="#13314A">Medi</tspan><tspan fill="#3365E2">Care</tspan>
  </text>
</svg>
