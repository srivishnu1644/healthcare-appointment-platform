<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MediCare — hook checks</title>
  </head>
  <body>
    <!--
      Harness page for `scripts/hook-checks.mjs`.

      It is NOT part of the application. Vite's production build only takes
      index.html as an entry, so nothing here reaches the shipped bundle; this
      file exists purely so the dev server can serve a page that mounts the real
      hooks in a real browser, with a real timezone and a controllable fetch.

      The network stub is installed by a CLASSIC script so it is in place before
      the module graph (and therefore `api/client.js`) is evaluated.
    -->
    <script>
      (function () {
        const routes = [];
        const calls = [];

        window.__net = {
          /** Queue a response. `match` is a substring of the request URL. */
          route(match, response, delayMs = 0, status = 200) {
            routes.push({ match, response, delayMs, status });
          },
          reset() {
            routes.length = 0;
            calls.length = 0;
          },
          calls() {
            return calls.slice();
          },
          countFor(match) {
            return calls.filter((u) => u.href.includes(match)).length;
          },
          /** The options the client passed to fetch for the nth matching call. */
          optsFor(match, nth = 0) {
            const hit = calls.filter((u) => u.href.includes(match));
            return hit[nth]?.opts ?? null;
          },
        };

        window.fetch = function (url, opts) {
          const href = String(url);
          calls.push({ href, opts });
          const hit = routes.find((r) => href.includes(r.match));
          if (!hit) {
            return Promise.resolve({
              ok: false,
              status: 404,
              json: async () => ({ success: false, message: "no route stubbed" }),
            });
          }
          const delay = new Promise((r) => setTimeout(r, hit.delayMs));
          return delay.then(() => ({
            ok: hit.status >= 200 && hit.status < 300,
            status: hit.status,
            json: async () => ({
              success: hit.status >= 200 && hit.status < 300,
              message: hit.status >= 200 && hit.status < 300 ? "ok" : "boom",
              data: hit.response,
              error: hit.status >= 200 && hit.status < 300 ? null : { code: "STUB_ERROR" },
            }),
          }));
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/checks/main.jsx"></script>
  </body>
</html>
